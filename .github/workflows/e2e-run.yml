name: e2e-run
run-name: e2e-run for setup ${{ inputs.setup_run_id }}

on:
  workflow_dispatch:
    inputs:
      setup_run_id:
        type: string
        required: true
      run_key:
        type: string
        required: true

permissions: {}

jobs:
  inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {actions: read, contents: read}
    outputs:
      shards: ${{ steps.inputs.outputs.shards }}
      fan_in: ${{ steps.inputs.outputs.fan_in }}
      live: ${{ steps.inputs.outputs.live }}
      bundle_sha: ${{ steps.inputs.outputs.bundle_sha }}
      base_url: ${{ steps.inputs.outputs.base_url }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: ./.github/actions/e2e-dist
        with: {cache: "false"}
      - uses: actions/download-artifact@v4
        with:
          name: e2e-plan
          path: e2e-in/plan
          run-id: ${{ inputs.setup_run_id }}
          github-token: ${{ github.token }}
      - id: inputs
        run: node scripts/e2e/dist/scripts/e2e/run/skeleton.js inputs e2e-in/plan
        env:
          SETUP_RUN_ID: ${{ inputs.setup_run_id }}
          RUN_KEY: ${{ inputs.run_key }}

  shards:
    needs: inputs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {actions: read, contents: read}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.inputs.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: ./.github/actions/e2e-dist
        with: {cache: "false"}
      - uses: actions/download-artifact@v4
        with:
          name: e2e-plan
          path: e2e-in/plan
          run-id: ${{ inputs.setup_run_id }}
          github-token: ${{ github.token }}
      - if: needs.inputs.outputs.live != 'true'
        run: node scripts/e2e/dist/scripts/e2e/run/skeleton.js shard e2e-in/plan e2e-out/shard
        env:
          SETUP_RUN_ID: ${{ inputs.setup_run_id }}
          RUN_KEY: ${{ inputs.run_key }}
          SHARD: ${{ matrix.shard }}
      - if: needs.inputs.outputs.live == 'true'
        run: node scripts/e2e/dist/scripts/e2e/run/skeleton.js tests e2e-in/plan e2e-out/test-list.txt
        env:
          SETUP_RUN_ID: ${{ inputs.setup_run_id }}
          RUN_KEY: ${{ inputs.run_key }}
          SHARD: ${{ matrix.shard }}
      - if: needs.inputs.outputs.live == 'true'
        uses: actions/download-artifact@v4
        with:
          name: e2e-bundle
          path: e2e-in/bundle
          run-id: ${{ inputs.setup_run_id }}
          github-token: ${{ github.token }}
      - if: needs.inputs.outputs.live == 'true'
        run: npx playwright install --with-deps chromium
      - if: needs.inputs.outputs.live == 'true'
        id: playwright
        continue-on-error: true
        run: npx playwright test --test-list e2e-out/test-list.txt
        env:
          CI: "true"
          E2E_BASE_URL: ${{ needs.inputs.outputs.base_url }}
          E2E_BUNDLE_DIR: e2e-in/bundle
          E2E_BUNDLE_SHA: ${{ needs.inputs.outputs.bundle_sha }}
          E2E_TICKET_KEY: ${{ secrets.E2E_TICKET_KEY }}
          E2E_SHARD: ${{ matrix.shard }}
          E2E_RUN_KEY: ${{ inputs.run_key }}
          E2E_SETUP_RUN_ID: ${{ inputs.setup_run_id }}
      - if: always() && needs.inputs.outputs.live == 'true'
        run: |
          mkdir -p e2e-out/shard
          if [ -f playwright-report/results.json ]; then cp playwright-report/results.json e2e-out/shard/report.json; fi
          if [ -d test-results ]; then cp -r test-results e2e-out/shard/test-results; fi
      - if: always()
        id: scrub
        run: node scripts/e2e/dist/scripts/e2e/report/scrub.mjs e2e-out/shard
      - if: always() && steps.scrub.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: e2e-out/shard/
          retention-days: 30

  fan-in:
    needs: [inputs, shards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {actions: write}
    steps:
      - if: needs.inputs.outputs.fan_in != 'false'
        run: gh workflow run e2e-report.yml --repo "$GITHUB_REPOSITORY" --ref staging -f setup_run_id="$SETUP_RUN_ID"
        env:
          GH_TOKEN: ${{ github.token }}
          SETUP_RUN_ID: ${{ inputs.setup_run_id }}
      - if: needs.inputs.outputs.fan_in == 'false'
        run: echo "Fan-in dispatch skipped by the setup plan; the scheduled report sweep picks this run up." >> "$GITHUB_STEP_SUMMARY"
