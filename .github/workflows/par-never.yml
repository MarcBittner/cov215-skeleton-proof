name: par-never
run-name: par-never ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      tag: {type: string, default: none}
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo "event=${{ github.event_name }} ref=${{ github.ref }} actor=${{ github.actor }} tag=${{ inputs.tag }}"
