name: e2e-report

on:
  workflow_dispatch:
    inputs:
      setup_run_id:
        type: string
        required: false
  schedule:
    - cron: "*/30 * * * *"

permissions: {}

jobs:
  targets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {actions: read, contents: read}
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      any: ${{ steps.targets.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: staging, persist-credentials: false}
      - uses: ./.github/actions/e2e-dist
      - id: targets
        run: node scripts/e2e/dist/scripts/e2e/report/cli.js targets
        env:
          GH_TOKEN: ${{ github.token }}
          SETUP_RUN_ID: ${{ inputs.setup_run_id }}

  report:
    needs: targets
    if: needs.targets.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ matrix.target.mode == 'live' && 'e2e-setup' || '' }}
    concurrency:
      group: e2e-report-${{ matrix.target.setup_run_id }}
      cancel-in-progress: false
    permissions: {actions: read, checks: write, contents: write, pull-requests: write}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    env:
      GH_TOKEN: ${{ github.token }}
      SETUP_RUN_ID: ${{ matrix.target.setup_run_id }}
      TRIGGER: ${{ inputs.setup_run_id && 'fan-in' || 'sweep' }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: staging, persist-credentials: false}
      - uses: ./.github/actions/e2e-dist
      - uses: actions/download-artifact@v4
        with:
          name: e2e-plan
          path: e2e-in/plan
          run-id: ${{ matrix.target.setup_run_id }}
          github-token: ${{ github.token }}
      - id: trust
        run: node scripts/e2e/dist/scripts/e2e/report/cli.js trust e2e-in/plan
        env:
          WAIT_SECONDS: ${{ github.event_name == 'workflow_dispatch' && '600' || '0' }}
      - if: steps.trust.outputs.ok == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-shard-*
          path: e2e-in/shards
          run-id: ${{ steps.trust.outputs.run_id }}
          github-token: ${{ github.token }}
      - if: steps.trust.outputs.ok == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-comment-rows-*
          path: e2e-in/rows
          merge-multiple: true
          run-id: ${{ matrix.target.setup_run_id }}
          github-token: ${{ github.token }}
      - if: steps.trust.outputs.ok == 'true'
        run: node scripts/e2e/dist/scripts/e2e/report/cli.js report e2e-in/plan e2e-in/shards e2e-in/rows e2e-out/outcome
        env:
          RUN_ID: ${{ steps.trust.outputs.run_id }}
      - if: steps.trust.outputs.ok != 'true' && steps.trust.outputs.record == 'true'
        run: node scripts/e2e/dist/scripts/e2e/report/cli.js reject e2e-out/outcome
        env:
          REASON: ${{ steps.trust.outputs.reason }}
      - if: steps.trust.outputs.record == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-outcome-${{ matrix.target.setup_run_id }}
          path: e2e-out/outcome/
          retention-days: 90

  flake:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {actions: read, contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {ref: staging, persist-credentials: false}
      - uses: ./.github/actions/e2e-dist
      - run: node scripts/e2e/dist/scripts/e2e/report/cli.js flake
        env:
          GH_TOKEN: ${{ github.token }}
