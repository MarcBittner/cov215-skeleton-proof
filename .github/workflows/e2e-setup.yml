name: e2e-setup

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [staging]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [fixture, live]
        default: fixture
      kind:
        type: choice
        options: [pr, postmerge, nightly, gate, mut, fallback, fresh, base]
        default: pr
      fixture_case:
        type: choice
        options: [pass, fail, drop, no-fan-in]
        default: pass

permissions: {}

jobs:
  resolve:
    if: >-
      github.event_name != 'pull_request_target' ||
      (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {contents: read}
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      kind: ${{ steps.resolve.outputs.kind }}
      fixture_case: ${{ steps.resolve.outputs.fixture_case }}
      deployment: ${{ steps.resolve.outputs.deployment }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - id: resolve
        run: node scripts/e2e/setup/t2/skeleton.ts resolve
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_KIND: ${{ inputs.kind }}
          INPUT_FIXTURE_CASE: ${{ inputs.fixture_case }}

  prepare:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ needs.resolve.outputs.mode == 'live' && 'e2e-setup' || '' }}
    concurrency:
      group: convex-${{ needs.resolve.outputs.deployment }}
      cancel-in-progress: false
    permissions: {actions: write, contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - id: prepare
        run: node scripts/e2e/setup/t2/skeleton.ts prepare e2e-out/plan
        env:
          MODE: ${{ needs.resolve.outputs.mode }}
          KIND: ${{ needs.resolve.outputs.kind }}
          FIXTURE_CASE: ${{ needs.resolve.outputs.fixture_case }}
      - if: steps.prepare.outputs.dispatch == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-plan
          path: e2e-out/plan/
          retention-days: 90
      - if: steps.prepare.outputs.dispatch == 'true'
        run: node scripts/e2e/setup/t2/skeleton.ts dispatch e2e-out/plan e2e-out/dispatch
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.prepare.outputs.dispatch == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-dispatch
          path: e2e-out/dispatch/
          retention-days: 90
