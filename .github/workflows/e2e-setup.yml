name: e2e-setup

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [staging]
  schedule:
    - cron: "0 5 * * *"
    - cron: "15,45 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [fixture, live]
        default: fixture
      kind:
        type: choice
        options: [pr, postmerge, nightly, gate, mut, fallback, fresh, base]
        default: base
      pr:
        type: string
        required: false
        description: Pull request number. Live mode runs it; fixture mode comments on it.
      fixture_case:
        type: choice
        options: [pass, fail, drop, no-fan-in]
        default: pass
      gate_ref:
        type: string
        required: false
        description: Gate runs only. The e2e/gate/<id>-<n> branch holding the drafted spec.
      gate_sha256:
        type: string
        required: false
        description: Gate runs only. sha256 of the drafted spec the gate is bound to.
      gate_break:
        type: choice
        options: [none, alter-query-field, drop-mutation-frame]
        default: none
        description: Gate runs only. The injected break this gate run applies.

permissions: {}

jobs:
  resolve:
    if: >-
      (github.event_name != 'pull_request_target' && github.event.schedule != '15,45 * * * *') ||
      (github.event_name == 'pull_request_target' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {contents: read, deployments: read, pull-requests: read}
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      kind: ${{ steps.resolve.outputs.kind }}
      fixture_case: ${{ steps.resolve.outputs.fixture_case }}
      pr: ${{ steps.resolve.outputs.pr }}
      deployment: ${{ steps.resolve.outputs.deployment }}
      live: ${{ steps.resolve.outputs.live }}
      refused: ${{ steps.resolve.outputs.refused }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      gate_spec: ${{ steps.resolve.outputs.gate_spec }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: ./.github/actions/e2e-dist
      - id: resolve
        run: node scripts/e2e/dist/scripts/e2e/setup/entry.js resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_KIND: ${{ inputs.kind }}
          INPUT_PR: ${{ inputs.pr }}
          INPUT_FIXTURE_CASE: ${{ inputs.fixture_case }}
          LIVE_SETUP: ${{ vars.E2E_LIVE_SETUP }}
          INPUT_GATE_REF: ${{ inputs.gate_ref }}
          INPUT_GATE_SHA256: ${{ inputs.gate_sha256 }}
          INPUT_GATE_BREAK: ${{ inputs.gate_break }}
          E2E_DRAFTS_LIVE: ${{ vars.E2E_DRAFTS_LIVE }}

  list:
    needs: resolve
    if: needs.resolve.outputs.live == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {contents: read, pull-requests: write}
    outputs:
      refused: ${{ steps.list.outputs.refused }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: ./.github/actions/e2e-dist
      - name: fetch the e2e tree of the listed commit as data
        run: |
          mkdir -p e2e-in/tree
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/tarball/$HEAD_SHA" \
            | tar -xz -C e2e-in/tree --strip-components=1 --wildcards '*/e2e/*'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
      - id: list
        run: node scripts/e2e/dist/scripts/e2e/setup/t2/static-list.js . e2e-in/tree e2e-list.json
        env:
          SETUP_RUN_ID: ${{ github.run_id }}
          PR: ${{ needs.resolve.outputs.pr }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          E2E_STAGE_DIR: e2e-out/stage
          E2E_GATE_SPEC: ${{ needs.resolve.outputs.gate_spec }}
      - if: always() && steps.list.outputs.refused != '' && hashFiles('e2e-out/stage/e2e-head/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-head
          path: e2e-out/stage/e2e-head/
          retention-days: 90
      - if: steps.list.outputs.refused != ''
        run: node scripts/e2e/dist/scripts/e2e/setup/t2/static-list.js note
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.resolve.outputs.pr }}
          REFUSED: ${{ steps.list.outputs.refused }}
      - if: steps.list.outputs.refused == ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-list
          path: e2e-list.json
          retention-days: 1

  prepare:
    needs: [resolve, list]
    if: always() && needs.resolve.result == 'success' && needs.resolve.outputs.refused == '' && needs.list.outputs.refused == '' && needs.list.result != 'failure' && needs.list.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ needs.resolve.outputs.live == 'true' && 'e2e-setup' || '' }}
    concurrency:
      group: e2e-deploy-${{ needs.resolve.outputs.deployment }}
      cancel-in-progress: false
    permissions: {actions: write, contents: write, deployments: read, pull-requests: write}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: ./.github/actions/e2e-dist
      - if: needs.resolve.outputs.live != 'true'
        id: prepare
        run: node scripts/e2e/dist/scripts/e2e/setup/entry.js prepare e2e-out/plan
        env:
          MODE: ${{ needs.resolve.outputs.mode }}
          KIND: ${{ needs.resolve.outputs.kind }}
          FIXTURE_CASE: ${{ needs.resolve.outputs.fixture_case }}
          PR: ${{ needs.resolve.outputs.pr }}
      - if: steps.prepare.outputs.dispatch == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-plan
          path: e2e-out/plan/
          retention-days: 90
      - if: steps.prepare.outputs.dispatch == 'true'
        id: fixture-dispatch
        run: node scripts/e2e/dist/scripts/e2e/setup/entry.js dispatch e2e-out/plan
      - if: always() && steps.fixture-dispatch.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-plan-final
          path: e2e-out/plan/
          retention-days: 90
      - if: needs.resolve.outputs.live == 'true'
        uses: actions/download-artifact@v4
        with:
          name: e2e-list
          path: e2e-in/list
      - if: needs.resolve.outputs.live == 'true'
        id: contain
        run: node scripts/e2e/dist/scripts/e2e/setup/t2/live-env.js contain
        env:
          E2E_DRAFTS_LIVE: ${{ vars.E2E_DRAFTS_LIVE }}
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_KIND: ${{ needs.resolve.outputs.kind }}
          INPUT_PR: ${{ needs.resolve.outputs.pr }}
          INPUT_GATE_REF: ${{ inputs.gate_ref }}
          INPUT_GATE_SHA256: ${{ inputs.gate_sha256 }}
          INPUT_GATE_BREAK: ${{ inputs.gate_break }}
          CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
          E2E_CONVEX_PREVIEW_DEPLOY_KEY: ${{ secrets.E2E_CONVEX_PREVIEW_DEPLOY_KEY }}
          LINEAR_API_KEY: ${{ secrets.E2E_LINEAR_API_KEY }}
          E2E_SETUP_ADMIN_EMAIL: ${{ vars.E2E_SETUP_ADMIN_EMAIL }}
          E2E_SETUP_ADMIN_USER_ID: ${{ vars.E2E_SETUP_ADMIN_USER_ID }}
          E2E_STAFF_USER_IDS: ${{ vars.E2E_STAFF_USER_IDS }}
          E2E_TICKET_AGE_RECIPIENT: ${{ vars.E2E_TICKET_AGE_RECIPIENT }}
          E2E_RUNNER_SLOTS: ${{ vars.E2E_RUNNER_SLOTS }}
          E2E_S5_RESULT: ${{ vars.E2E_S5_RESULT }}
          E2E_SHARD_OVERHEAD_MS: ${{ vars.E2E_SHARD_OVERHEAD_MS }}
          E2E_MANIFEST_SCHEMA_VERSION: ${{ vars.E2E_MANIFEST_SCHEMA_VERSION }}
          E2E_LIST_FILE: e2e-in/list/e2e-list.json
          E2E_DEPLOYMENT: ${{ needs.resolve.outputs.deployment }}
          E2E_STAGE_DIR: e2e-out/stage
          E2E_WORK_DIR: e2e-out/work
      - if: always() && steps.contain.outcome != 'skipped' && hashFiles('e2e-out/stage/e2e-control/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-control
          path: e2e-out/stage/e2e-control/
          retention-days: 90
          overwrite: true
      - if: always() && steps.contain.outcome != 'skipped' && hashFiles('e2e-out/stage/e2e-head/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-head
          path: e2e-out/stage/e2e-head/
          retention-days: 90
          overwrite: true
      - if: always() && steps.contain.outcome != 'skipped' && hashFiles('e2e-out/stage/e2e-plan/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-plan
          path: e2e-out/stage/e2e-plan/
          retention-days: 90
          overwrite: true
      - if: steps.contain.outputs.contained == 'true' && needs.resolve.outputs.kind == 'nightly' && (vars.E2E_DRAFTS_LIVE == '1' || vars.E2E_DRAFTS_LIVE == 'dry')
        id: drafts-input
        run: node scripts/e2e/dist/scripts/e2e/setup/t5/drafts-input.js fetch e2e-out/work
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - if: steps.contain.outputs.contained == 'true'
        id: live
        run: node scripts/e2e/dist/scripts/e2e/setup/t2/live-env.js prepare
        env:
          ANTHROPIC_API_KEY: ${{ secrets.E2E_ANTHROPIC_API_KEY }}
          E2E_DRAFTS_LIVE: ${{ vars.E2E_DRAFTS_LIVE }}
          E2E_SELECT_MODE: ${{ vars.E2E_SELECT_MODE }}
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_KIND: ${{ needs.resolve.outputs.kind }}
          INPUT_PR: ${{ needs.resolve.outputs.pr }}
          INPUT_GATE_REF: ${{ inputs.gate_ref }}
          INPUT_GATE_SHA256: ${{ inputs.gate_sha256 }}
          INPUT_GATE_BREAK: ${{ inputs.gate_break }}
          CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
          E2E_CONVEX_PREVIEW_DEPLOY_KEY: ${{ secrets.E2E_CONVEX_PREVIEW_DEPLOY_KEY }}
          LINEAR_API_KEY: ${{ secrets.E2E_LINEAR_API_KEY }}
          E2E_SETUP_ADMIN_EMAIL: ${{ vars.E2E_SETUP_ADMIN_EMAIL }}
          E2E_SETUP_ADMIN_USER_ID: ${{ vars.E2E_SETUP_ADMIN_USER_ID }}
          E2E_STAFF_USER_IDS: ${{ vars.E2E_STAFF_USER_IDS }}
          E2E_TICKET_AGE_RECIPIENT: ${{ vars.E2E_TICKET_AGE_RECIPIENT }}
          E2E_RUNNER_SLOTS: ${{ vars.E2E_RUNNER_SLOTS }}
          E2E_S5_RESULT: ${{ vars.E2E_S5_RESULT }}
          E2E_SHARD_OVERHEAD_MS: ${{ vars.E2E_SHARD_OVERHEAD_MS }}
          E2E_MANIFEST_SCHEMA_VERSION: ${{ vars.E2E_MANIFEST_SCHEMA_VERSION }}
          E2E_LIST_FILE: e2e-in/list/e2e-list.json
          E2E_DEPLOYMENT: ${{ needs.resolve.outputs.deployment }}
          E2E_STAGE_DIR: e2e-out/stage
          E2E_WORK_DIR: e2e-out/work
      - if: always() && steps.live.outcome != 'skipped' && hashFiles('e2e-out/stage/e2e-plan/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-plan
          path: e2e-out/stage/e2e-plan/
          retention-days: 90
          overwrite: true
      - if: always() && steps.live.outcome != 'skipped' && hashFiles('e2e-out/stage/e2e-control/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-control
          path: e2e-out/stage/e2e-control/
          retention-days: 90
          overwrite: true
      - if: always() && steps.live.outcome != 'skipped' && hashFiles('e2e-out/stage/e2e-bundle/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-bundle
          path: e2e-out/stage/e2e-bundle/
          retention-days: 1
      - if: always() && steps.live.outcome != 'skipped' && hashFiles('e2e-out/stage/e2e-head/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-head
          path: e2e-out/stage/e2e-head/
          retention-days: 90
          overwrite: true
      - if: always() && steps.live.outcome != 'skipped' && hashFiles('e2e-out/work/map/manifest.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-map
          path: e2e-out/work/map/
          retention-days: 1
      - if: always() && steps.live.outcome != 'skipped' && hashFiles('e2e-out/stage/e2e-map-plan/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-map-plan
          path: e2e-out/stage/e2e-map-plan/
          retention-days: 90
      - if: always() && steps.live.outcome != 'skipped' && hashFiles('e2e-out/stage/e2e-comment-rows-t3/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-comment-rows-t3
          path: e2e-out/stage/e2e-comment-rows-t3/
          retention-days: 90
      - if: always() && steps.live.outcome != 'skipped' && hashFiles('e2e-out/stage/e2e-comment-rows-t4/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-comment-rows-t4
          path: e2e-out/stage/e2e-comment-rows-t4/
          retention-days: 90
      - if: always() && steps.live.outcome != 'skipped' && hashFiles('e2e-out/stage/e2e-comment-rows-t5/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-comment-rows-t5
          path: e2e-out/stage/e2e-comment-rows-t5/
          retention-days: 90
      - if: steps.live.outcome == 'success' && needs.resolve.outputs.kind == 'nightly' && vars.E2E_DRAFTS_LIVE == '1' && hashFiles('e2e-out/work/gate-requests.json') != ''
        id: gates
        run: node scripts/e2e/dist/scripts/e2e/setup/t5/dispatch-gates.js e2e-out/work/gate-requests.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          E2E_DRAFTS_LIVE: ${{ vars.E2E_DRAFTS_LIVE }}
      - if: always() && hashFiles('e2e-out/work/drafts-state.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-drafts
          path: |
            e2e-out/work/drafts-state.json
            e2e-out/work/drafts-report.json
            e2e-out/work/gate-requests.json
            e2e-out/work/dry-drafts/
          retention-days: 30
      - if: always() && steps.live.outcome != 'skipped' && hashFiles('e2e-out/stage/e2e-select-ai/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-select-ai
          path: e2e-out/stage/e2e-select-ai/
          retention-days: 90
      - if: steps.live.outputs.dispatch == 'true'
        id: dispatch
        run: node scripts/e2e/dist/scripts/e2e/setup/t2/live-env.js dispatch
        env:
          E2E_DRAFTS_LIVE: ${{ vars.E2E_DRAFTS_LIVE }}
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_KIND: ${{ needs.resolve.outputs.kind }}
          INPUT_PR: ${{ needs.resolve.outputs.pr }}
          INPUT_GATE_REF: ${{ inputs.gate_ref }}
          INPUT_GATE_SHA256: ${{ inputs.gate_sha256 }}
          INPUT_GATE_BREAK: ${{ inputs.gate_break }}
          CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
          E2E_CONVEX_PREVIEW_DEPLOY_KEY: ${{ secrets.E2E_CONVEX_PREVIEW_DEPLOY_KEY }}
          LINEAR_API_KEY: ${{ secrets.E2E_LINEAR_API_KEY }}
          E2E_SETUP_ADMIN_EMAIL: ${{ vars.E2E_SETUP_ADMIN_EMAIL }}
          E2E_SETUP_ADMIN_USER_ID: ${{ vars.E2E_SETUP_ADMIN_USER_ID }}
          E2E_STAFF_USER_IDS: ${{ vars.E2E_STAFF_USER_IDS }}
          E2E_TICKET_AGE_RECIPIENT: ${{ vars.E2E_TICKET_AGE_RECIPIENT }}
          E2E_RUNNER_SLOTS: ${{ vars.E2E_RUNNER_SLOTS }}
          E2E_S5_RESULT: ${{ vars.E2E_S5_RESULT }}
          E2E_SHARD_OVERHEAD_MS: ${{ vars.E2E_SHARD_OVERHEAD_MS }}
          E2E_MANIFEST_SCHEMA_VERSION: ${{ vars.E2E_MANIFEST_SCHEMA_VERSION }}
          E2E_LIST_FILE: e2e-in/list/e2e-list.json
          E2E_DEPLOYMENT: ${{ needs.resolve.outputs.deployment }}
          E2E_STAGE_DIR: e2e-out/stage
          E2E_WORK_DIR: e2e-out/work
      - if: always() && steps.dispatch.outcome != 'skipped' && hashFiles('e2e-out/stage/e2e-plan-final/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-plan-final
          path: e2e-out/stage/e2e-plan-final/
          retention-days: 90
      - if: always() && steps.dispatch.outcome != 'skipped' && hashFiles('e2e-out/stage/e2e-head/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-head
          path: e2e-out/stage/e2e-head/
          retention-days: 90
          overwrite: true

  sweep:
    if: github.event_name == 'schedule' && github.event.schedule == '15,45 * * * *' && vars.E2E_LIVE_SETUP == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: e2e-setup
    concurrency:
      group: e2e-setup-sweep
      cancel-in-progress: false
    permissions: {actions: write, contents: write, deployments: read, pull-requests: write}
    outputs:
      restored: ${{ steps.staged.outputs.restored }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: ./.github/actions/e2e-dist
      - run: node scripts/e2e/dist/scripts/e2e/setup/t2/live-env.js sweep
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_KIND: ${{ needs.resolve.outputs.kind }}
          INPUT_PR: ${{ needs.resolve.outputs.pr }}
          CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
          E2E_CONVEX_PREVIEW_DEPLOY_KEY: ${{ secrets.E2E_CONVEX_PREVIEW_DEPLOY_KEY }}
          LINEAR_API_KEY: ${{ secrets.E2E_LINEAR_API_KEY }}
          E2E_SETUP_ADMIN_EMAIL: ${{ vars.E2E_SETUP_ADMIN_EMAIL }}
          E2E_SETUP_ADMIN_USER_ID: ${{ vars.E2E_SETUP_ADMIN_USER_ID }}
          E2E_STAFF_USER_IDS: ${{ vars.E2E_STAFF_USER_IDS }}
          E2E_TICKET_AGE_RECIPIENT: ${{ vars.E2E_TICKET_AGE_RECIPIENT }}
          E2E_RUNNER_SLOTS: ${{ vars.E2E_RUNNER_SLOTS }}
          E2E_S5_RESULT: ${{ vars.E2E_S5_RESULT }}
          E2E_SHARD_OVERHEAD_MS: ${{ vars.E2E_SHARD_OVERHEAD_MS }}
          E2E_MANIFEST_SCHEMA_VERSION: ${{ vars.E2E_MANIFEST_SCHEMA_VERSION }}
          E2E_LIST_FILE: e2e-in/list/e2e-list.json
          E2E_DEPLOYMENT: ${{ needs.resolve.outputs.deployment }}
          E2E_STAGE_DIR: e2e-out/stage
          E2E_WORK_DIR: e2e-out/work
          E2E_SWEEP_START_SETUP: "1"
          E2E_SWEEP_RESTORE: "1"
      - id: staged
        if: always()
        run: |
          mkdir -p e2e-out/stage
          echo "restored=$(ls e2e-out/stage | grep -E '^e2e-restored-[0-9]+$' | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
      - if: always() && steps.staged.outputs.restored != '[]'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-sweep-stage
          path: e2e-out/stage/
          retention-days: 1

  sweep-marks:
    needs: sweep
    if: always() && needs.sweep.outputs.restored != '' && needs.sweep.outputs.restored != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    strategy:
      matrix:
        name: ${{ fromJSON(needs.sweep.outputs.restored) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: e2e-sweep-stage
          path: e2e-in/stage
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: e2e-in/stage/${{ matrix.name }}/
          retention-days: 90
