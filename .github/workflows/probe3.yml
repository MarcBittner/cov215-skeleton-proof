name: probe3
run-name: e2e-run for setup ${{ inputs.setup_run_id }}

on:
  workflow_dispatch:
    inputs:
      setup_run_id:
        type: string
        required: true
      run_key:
        type: string
        required: true

permissions: {}

jobs:
  inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {actions: read, contents: read}
    outputs:
      shards: ${{ steps.inputs.outputs.shards }}
      fan_in: ${{ steps.inputs.outputs.fan_in }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - uses: actions/download-artifact@v4
        with:
          name: e2e-plan
          path: e2e-in/plan
          run-id: ${{ inputs.setup_run_id }}
          github-token: ${{ github.token }}
      - id: inputs
        run: node scripts/e2e/run/skeleton.ts inputs e2e-in/plan
        env:
          SETUP_RUN_ID: ${{ inputs.setup_run_id }}
          RUN_KEY: ${{ inputs.run_key }}

  shards:
    needs: inputs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {actions: read, contents: read}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.inputs.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - uses: actions/download-artifact@v4
        with:
          name: e2e-plan
          path: e2e-in/plan
          run-id: ${{ inputs.setup_run_id }}
          github-token: ${{ github.token }}
      - run: node scripts/e2e/run/skeleton.ts shard e2e-in/plan e2e-out/shard
        env:
          SHARD: ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: e2e-out/shard/
          retention-days: 30

  fan-in:
    needs: [inputs, shards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {actions: write}
    steps:
      - if: needs.inputs.outputs.fan_in != 'false'
        run: gh workflow run e2e-report.yml --repo "$GITHUB_REPOSITORY" --ref staging -f setup_run_id="$SETUP_RUN_ID"
        env:
          GH_TOKEN: ${{ github.token }}
          SETUP_RUN_ID: ${{ inputs.setup_run_id }}
      - if: needs.inputs.outputs.fan_in == 'false'
        run: echo "Fan-in dispatch skipped by the setup plan; the scheduled report sweep picks this run up." >> "$GITHUB_STEP_SUMMARY"
